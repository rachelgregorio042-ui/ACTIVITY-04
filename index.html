<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rachefe Coffee Bar Business Card</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <main class="card-container">

    <!-- FRONT CARD -->
    <div class="card front-card">
      <img src="backgroundFont.jpg" alt="Card Background" class="card-bg">

      <div class="card-content">
        <!-- Header / Logo Area -->
        <header class="brand-header">
          <img src="icon.png" alt="Coffee Cup Icon" class="brand-icon">
          <div class="brand-titles">
            <h1 class="brand-name">rachefe <span class="sub-tag">COFFEE BAR</span></h1>
            <p class="tagline">Where Focus Meets Flavor</p>
          </div>
        </header>

        <!-- Body / Main Content Grid -->
        <div class="front-body">
          <div class="contact-list">
            <div class="contact-item">
              <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <span>+69458471411</span>
            </div>
            <div class="contact-item">
              <svg class="contact-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
              <span>rachefe-coffeebar</span>
            </div>
            <div class="contact-item">
              <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              <span>www.rachefecoffeebar.com</span>
            </div>
            <div class="contact-item">
              <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span>Brgy. Poblacion, Lupon, Davao Or.</span>
            </div>
          </div>

          <div class="vertical-divider"></div>

          <div class="qr-wrapper">
            <img src="qr.jpg" alt="QR Code" class="qr-code">
          </div>
        </div>
      </div>
    </div>

    <!-- BACK CARD -->
    <div class="card back-card">
      <img src="beans.png" alt="Coffee Beans Header" class="beans-img">
      
      <!-- Linear outline cup drawing (SVG overlay) -->
      <svg class="cup-line-art" viewBox="0 0 200 200" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2">
        <path d="M 40 80 Q 30 140 100 150 Q 170 140 160 80 C 180 80 190 110 160 120" />
        <ellipse cx="100" cy="80" rx="60" ry="12" />
        <ellipse cx="100" cy="160" rx="80" ry="8" />
      </svg>

      <div class="card-content back-content">
        <header class="brand-header">
          <img src="icon.png" alt="Coffee Cup Icon" class="brand-icon">
          <div class="brand-titles">
            <h1 class="brand-name">rachefe <span class="sub-tag">COFFEE BAR</span></h1>
            <p class="tagline">Where Focus Meets Flavor</p>
          </div>
        </header>
      </div>
    </div>

  </main>

</body>
</html>
